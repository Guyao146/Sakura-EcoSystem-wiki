<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="樱落生态：连接云、人、家">
  <title>樱落生态Wiki</title>
  <script>try{document.documentElement.dataset.wikiTheme=localStorage.getItem('sakura-wiki-theme')||'night'}catch(e){document.documentElement.dataset.wikiTheme='night'}</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/theme.css?v=9">
</head>
<body>
  <div id="app">正在载入樱落生态Wiki...</div>
  <script>
    window.$docsify = {
      name: false,
      loadSidebar: true, subMaxLevel: 2, alias: {'/.*/_sidebar.md': '/_sidebar.md'},homepage: 'README.md',
      search: { paths: 'auto', placeholder: '搜索文档', noData: '没有找到结果' },
      copyCode: { buttonText: '复制代码', successText: '已复制' },
      pagination: { previousText: '上一页', nextText: '下一页' },
      mergeNavbar: true, themeColor: '#b84d66'
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="assets/theme.js?v=1"></script>
</body>
</html>
